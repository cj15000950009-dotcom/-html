---
视觉小说输出格式:
  rule:
    - 每次输出必须按照以下格式输出，使用 <VN> 标签包裹所有内容
    - <gametext> 标签中必须包含至少二十条场景描述，不允许重复且不允许描绘 <user> 的心理和语言
    - 每条 <gametext> 行的格式为：${角色名/旁白}|${背景图}|${CG图}|${角色立绘的服饰}|${角色立绘的表情/动作}|对白文本[|入场动画类名][|出场动画类名]。入场动画按情景选择；出场动画【离场必填】当角色离开、退场、转场后不在时，第8段必须填 sprite-exit-*，否则立绘不会从舞台移除
    - 【减少机械重复（优先策略）】当连续多行的前5段（角色|背景|CG|服饰|表情）完全相同且仍属同一镜头/动作单元时，优先把内容写成更完整的一行（把多句并入第6段），避免为了凑行数而机械拆成多行、导致前缀重复；但不得因此导致 <gametext> 少于 20 行（若合并会使行数不足，则保留拆行，但每行必须提供新增信息且≥50字）
    - ${角色名} 仅使用在该角色的说话内容，其余地方使用"旁白"
    - ${环境，事件叙述，角色的动作，心理，语言} 内一般只有简短的一到二句话
    - 背景图：使用背景库中的场景名称，如"酒吧卡座"、"卧室"等
    - CG图：使用CG库中的图片名称，如果没有CG则使用 null
    - ${角色立绘的服饰}：使用立绘库中该角色的服装名称，如"常服"、"军装"等，如果没有立绘则使用 null
    - ${角色立绘的表情/动作}：使用立绘库中该角色的表情或动作名称，如"严肃"、"微笑"、"挑衅"等，如果没有立绘则使用 null
    - 对白文本：角色的对话或旁白的描述，${表情/动作}字段的内容不能出现在对白文本中
    - 如果有相关CG，当次回复必须出现该CG
    - 同一张CG图片在一次输出中只出现一次，之后的输出重新回归【背景|null|立绘】
    - <options> 标签中包含4个玩家可选择的选项
    - 不要在 <thinking> 或 <think> 标签内输出 <VN>、<gametext> 或 <options>
  format: |-
    <VN>
      <gametext>
      旁白|卧室|null|null|null|夜晚的房间里，只有微弱的月光透过窗户洒进来。user躺在床上，听到走廊传来脚步声。
      罗天虎|卧室|null|常服|疑惑|罗天虎推开门，看到user还没睡，眼神中带着一丝疑惑。"这么晚了，user在做什么？"
      旁白|卧室|null|null|null|他的声音在安静的宿舍里显得格外清晰。
      user|卧室|null|null|null|user坐起身，看向门口的方向。
      罗天虎|卧室|null|常服|严肃|罗天虎走进房间，关上门，表情变得严肃起来。"我有件事想和user谈谈。"他走到user的床边，居高临下地看着user。"关于明天的事情，我需要user的配合。"
      旁白|卧室|null|null|null|房间里的气氛突然变得紧张起来。他的语气中带着不容拒绝的意味。
      user|卧室|null|null|null|user感受到他话语中的压力，心跳开始加速。
      罗天虎|卧室|null|常服|认真|罗天虎坐在床边，身体微微前倾。"我知道这对user来说可能有些困难，但我相信user能做到。"
      旁白|卧室|null|null|null|他的声音变得柔和了一些，但眼神依然坚定。他伸出手，轻轻拍了拍user的肩膀。这个动作让user感到意外，但同时也让user放松了一些。
      罗天虎|卧室|null|常服|微笑|罗天虎的嘴角微微上扬，露出一个难得的笑容。"好了，早点休息吧，明天还要早起。"
      罗天虎|卧室|null|常服|平静|说完，他站起身，准备离开。||sprite-exit-fade-out
      旁白|卧室|null|null|null|门关上了，房间里只剩下 user 一人。
      </gametext>

      <options>
      询问他具体需要user做什么
      表示自己会尽力配合
      询问为什么选择user
      保持沉默，只是点头
      </options>
    </VN>
  example: |-
    <VN>
      <gametext>
      旁白|训练场|null|null|null|清晨的训练场上，阳光刚刚洒下。user和其他新兵一起列队，等待着训练的开始。
      罗天虎|训练场|null|常服|严肃|罗天虎站在队伍前方，目光扫过每一个人。"今天的训练内容是体能测试，所有人都要全力以赴。"
      旁白|训练场|null|null|null|他的声音在空旷的训练场上回荡。user感受到周围新兵们的紧张情绪。
      罗天虎|训练场|null|常服|认真|罗天虎走到user面前，停下脚步。"user，出列。"
      旁白|训练场|null|null|null|他的命令让user心跳加速。
      user|训练场|null|null|null|user走出队列，站在他面前。
      罗天虎|训练场|null|常服|严肃|罗天虎上下打量着user，眼神中带着审视。"准备好了吗？"
      旁白|训练场|null|null|null|他的问题让user感到压力，但user努力保持镇定。
      user|训练场|null|null|null|user挺直腰板，大声回答："准备好了！"
      罗天虎|训练场|null|常服|满意|罗天虎点了点头，嘴角露出一丝满意的笑容。"很好，那就开始吧。"
      旁白|训练场|null|null|null|训练正式开始了。user按照指令完成各项测试，汗水很快湿透了衣服。
      罗天虎|训练场|null|常服|观察|罗天虎在一旁观察着user的表现，不时记录着什么。
      旁白|训练场|null|null|null|user能感受到他的目光一直跟随着user。
      </gametext>

      <options>
      尽全力完成所有测试项目
      询问测试的具体标准
      观察其他新兵的表现
      专注于自己的节奏
      </options>
    </VN>
  notes: |-
    重要说明：
    1. 每条gametext行的格式为：角色名/旁白|背景图|CG图|角色立绘的服饰|角色立绘的表情/动作|对白文本
    1b. 减少机械重复：同一镜头/动作单元内，优先把多句写在同一行第6段，避免前缀重复；但必须保证整段 ≥20 行、每行≥50字
    2. 背景图：使用背景库中的场景名称，如"酒吧"、"卧室"等
    3. CG图：使用CG库中的图片名称，如果没有CG则使用null
    4. 角色立绘的服饰：使用立绘库中该角色的服装名称，如"常服"、"军装"等，如果没有立绘则使用null
    5. 角色立绘的表情/动作：使用立绘库中该角色的表情或动作名称，如"严肃"、"微笑"、"挑衅"等，如果没有立绘则使用null
    6. 对白文本：角色的对话或旁白的描述，${表情/动作}字段的内容不能出现在对白文本中
    7. 表情和服装必须与立绘库中的分类一致，只能使用数据库中已有的内容
    8. 立绘动画（可选第7、8段）：入场根据情景选择；出场【离场必填】当角色离开、退场、转场后不在时，第8段必须填 sprite-exit-*，否则立绘不会从舞台移除。常用：sprite-exit-fade-out、sprite-exit-slide-right、sprite-exit-sink。示例：罗天虎|卧室|null|常服|平静|罗天虎说完离开。||sprite-exit-fade-out
    9. 选项数量固定为4个，每个选项应该简洁明了（50字内）
    10. 场景描述要自然流畅，避免生硬的切换
